<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#021512;color:#d8f7ee;font:20px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;padding:60px 70px}
.p{color:#50d2c1}.ok{color:#5ef0c4}.dim{color:#5f8078}.y{color:#f0c56a}
#o div{opacity:0;transition:opacity .25s}#o div.v{opacity:1}
</style></head><body><div><span class="p">~/mulligan $</span> forge test</div><div id="o"></div>
<script>
fetch("tests.txt").then(r=>r.text()).then(t=>{const o=document.getElementById("o");const L=t.trim().split("\n");
L.forEach((l,i)=>{const d=document.createElement("div");d.innerHTML=l.replace("[PASS]",'<span class="ok">[PASS]</span>').replace(/\((256 fuzz runs)\)/,'<span class="y">($1)</span>').replace(/(Suite result: ok\.)/,'<span class="ok">$1</span>');o.appendChild(d);setTimeout(()=>d.classList.add("v"),700+i*380)})});
</script></body></html>
