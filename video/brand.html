<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#021512;font-family:"Inter Tight",sans-serif;color:#f2fbf8}
body{background:radial-gradient(80% 90% at 70% 100%,rgba(47,224,181,.32),transparent 70%),#021512}
canvas{position:fixed;inset:0;width:100%;height:100%}
.c{position:fixed;inset:0;display:grid;place-items:center;text-align:center}
.lock{display:flex;align-items:center;gap:34px;font-weight:500;font-size:150px;letter-spacing:-.05em;opacity:0;transform:translateY(24px) scale(.97);transition:all 1.1s cubic-bezier(.2,.8,.2,1)}
.lock img{width:190px}
.sub{margin-top:28px;font:400 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#9fbfb7;opacity:0;transition:opacity 1s .5s}
.sub b{color:#50d2c1;font-weight:400}
.on .lock{opacity:1;transform:none}.on .sub{opacity:1}
.tag{display:inline-block;margin-top:22px;padding:8px 14px;border:1px solid #f0c56a;color:#f0c56a;font:400 15px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .8s 1.2s}
.on .tag{opacity:1}
</style></head><body>
<canvas id="f"></canvas>
<div class="c"><div><div class="lock"><img src="mark.svg">mulligan</div>
<div class="sub" id="sub"></div><div><span class="tag" id="tag"></span></div></div></div>
<script>
const close=location.hash==="#close";
document.getElementById("sub").innerHTML=close?"<b>mulligan-hyperevm.vercel.app</b> &nbsp;·&nbsp; github.com/Nuel-osas/mulligan":"[ Perps on HyperEVM &nbsp;·&nbsp; priced by <b>HyperCore</b> ]";
document.getElementById("tag").textContent=close?"Lose a trade. Keep a piece of the house.":"Loss-mining, fixed";
setTimeout(()=>document.body.classList.add("on"),close?400:2600);
const c=document.getElementById("f"),x=c.getContext("2d");let w,h;const R=()=>{w=c.width=innerWidth;h=c.height=innerHeight};R();
const sp=()=>({x:Math.random()*w,y:-10-Math.random()*h*.6,vx:(Math.random()-.5)*.3,vy:.9+Math.random()*1.4,r:2+Math.random()*7,b:false});
const ps=[];for(let i=0;i<170;i++){const p=sp();p.y=Math.random()*h;ps.push(p)}let f=false;
(function t(){x.clearRect(0,0,w,h);const fl=h-90;const g=x.createLinearGradient(0,fl-50,0,h);g.addColorStop(0,"rgba(151,252,228,0)");g.addColorStop(1,"rgba(151,252,228,.16)");x.fillStyle=g;x.fillRect(0,fl-50,w,h);
for(const p of ps){p.x+=p.vx;p.y+=p.vy;if(!p.b&&p.y>fl){f=!f;if(f){p.b=true;p.vy=-(1.4+Math.random()*1.4);p.r*=.7}else Object.assign(p,sp())}if(p.b&&p.y<-20)Object.assign(p,sp());
x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.shadowBlur=p.b?16:0;x.shadowColor="rgba(151,252,228,.9)";x.fillStyle=p.b?"#c9fff2":"#97fce4";x.globalAlpha=.85;x.fill()}x.globalAlpha=1;requestAnimationFrame(t)})();
</script></body></html>
